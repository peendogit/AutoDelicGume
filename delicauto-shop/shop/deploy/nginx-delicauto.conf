# /etc/nginx/sites-available/delicauto  (zatim: ln -s na sites-enabled, nginx -t, systemctl reload nginx)
# Zatim HTTPS:  certbot --nginx -d delicauto.com -d www.delicauto.com
server {
    listen 80;
    server_name delicauto.com www.delicauto.com;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
